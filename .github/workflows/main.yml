name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet Xcode
        run: brew install xcodegen && xcodegen generate
      - name: Compiler (sans signature)
        run: |
          xcodebuild -project LidarScan.xcodeproj -scheme LidarScan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScan.app Payload/
          zip -qr LidarScan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LidarScan-ipa
          path: LidarScan.ipa
