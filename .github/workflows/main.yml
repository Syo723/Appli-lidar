name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les fichiers
        run: |
          mkdir -p Sources
          find . -name "*.swift" -not -path "./Sources/*" -not -path "./.git/*" -exec mv {} Sources/ \;
          ls Sources/*.swift || { echo "Aucun fichier .swift trouvé"; ls -R .; exit 1; }
          cat > project.yml <<'YML'
          name: LidarScan
          options:
            deploymentTarget:
              iOS: "17.0"
          targets:
            LidarScan:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscan
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "Scan 3D"
                  INFOPLIST_KEY_NSCameraUsageDescription: "La caméra sert à scanner des objets en 3D."
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
          YML

      - name: Générer le projet Xcode
        run: brew install xcodegen && xcodegen generate

      - name: Compiler (sans signature)
        run: |
          xcodebuild -project LidarScan.xcodeproj -scheme LidarScan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScan.app Payload/
          zip -qr LidarScan.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarScan-ipa
          path: LidarScan.ipa
